name: rcm
version: "0.1.0"
config-version: 2
profile: rcm

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  rcm:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  rcm:
    +schema: reference
    carc_reference:
      +column_types:
        carc_code: varchar
        description: varchar
        is_denial: boolean
        carc_group: varchar

flags:
  send_anonymous_usage_stats: false
