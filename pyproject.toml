[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rcm"
version = "0.1.0"
description = "AI Revenue Cycle Copilot: predicts claim denial risk and ranks a worklist (synthetic data only)."
readme = "PRD.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "duckdb>=1.1",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "dbt-core>=1.10,<1.13",
    "dbt-duckdb>=1.10",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rcm"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["rcm", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
