version: 2

models:
  - name: int_claim_outcomes
    description: "One row per claim: the first-remit outcome and denial reason. Labels only."
    columns:
      - name: claim_id
        data_tests:
          - not_null
          - unique
      - name: is_denied
        data_tests:
          - not_null

  - name: int_claim_line_summary
    description: "One row per claim: service-line facts known at submission."
    columns:
      - name: claim_id
        data_tests:
          - not_null
          - unique
      - name: primary_cpt_code
        data_tests:
          - not_null
